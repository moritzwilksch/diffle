- dialog "Keyboard shortcuts":
  - heading "Keyboard shortcuts" [level=3]
  - button "Close"
  - heading "Move" [level=4]
  - text: "j / k or ↓ / ↑ next / previous line {n}j / {n}k n lines down / up Ctrl+d / Ctrl+u half a page down / up Ctrl+o / Ctrl+i jump back / forward in history ← or ⌘/Ctrl+Shift+e / → focus the file tree / back to the diff V, then j / k extend a block selection"
  - heading "Files and hunks" [level=4]
  - text: "J / K next / previous file gg / G first / last file {n}gg / {n}G line n of the current file ] / [ n / N next / previous hunk (n / N follow matches while searching) v toggle viewed on the current file zo / zc expand / collapse the current file (zo loads a large diff) zO / zC open / close all files F view the current file whole; Ctrl+o returns"
  - heading "Comments" [level=4]
  - text: c comment on the current line or selection C comment on the current file as a whole e edit the newest message of the thread under the cursor dd delete the thread under the cursor R resolve / reopen the thread under the cursor yy or Y copy all comments
  - heading "Search" [level=4]
  - text: "/ search the current file, then n / N between matches g/ search changed files (toggle: diff + context / full file) ⌘/Ctrl+p or gf search files by name w / b focus the next / previous symbol on the line 0 / $ focus the first / last symbol on the line * / # next / previous occurrence of the focused word"
  - heading "Code intelligence (language server)" [level=4]
  - text: "hover a symbol or gh signature and docs tooltip (gh: focused word); Esc closes click a symbol definition / type definition / references popover gd or ⌘/Ctrl+click go to the definition of the hovered symbol gy go to the definition of the hovered symbol’s type gA list references; j / k, Enter to jump, n / N to step gs / gS symbols in the current file / across the repository"
  - heading "View" [level=4]
  - text: "zz scroll the current line to eye level zt / zb scroll the current line to the top / bottom s toggle split / unified t cycle theme ⌘/Ctrl+b toggle the file tree (Shift: comments panel) o GitHub repository and pull request m, then 1–4 open the mode picker and choose an entry"
  - heading "General" [level=4]
  - text: "? toggle this help Esc close composer, search, or menu; clear selection"