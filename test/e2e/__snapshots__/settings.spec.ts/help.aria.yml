- dialog "Keyboard shortcuts":
  - heading "Keyboard shortcuts" [level=3]
  - link "Docs":
    - /url: https://diffle.app
  - link "GitHub repository":
    - /url: https://github.com/moritzwilksch/diffle
  - button "Close"
  - heading "Move" [level=4]
  - text: "j / k or ↓ / ↑ next / previous line {n}j / {n}k n lines down / up Ctrl+d / Ctrl+u half a page down / up Ctrl+o / Ctrl+i jump back / forward in history ← or ⌘/Ctrl+Shift+e / → focus the file tree / back to the diff V, then j / k extend a block selection"
  - heading "Files and hunks" [level=4]
  - text: "J / K next / previous file gg / G first / last file {n}gg / {n}G line n of the current file ] / [ n / N next / previous hunk (n / N follow matches while searching) v toggle viewed on the current file gv toggle viewed on the file above zo / zc expand / collapse the current file (zo loads a large diff) zO / zC open / close all files F view the current file whole; Ctrl+o returns"
  - heading "Comments" [level=4]
  - text: c comment on the current line or selection C comment on the current file as a whole e edit the newest message of the thread under the cursor dd delete the thread under the cursor R resolve / reopen the thread under the cursor yy or Y copy all comments yp copy the current file’s path yl copy a GitHub link to the line or selection
  - heading "View" [level=4]
  - text: "zz scroll the current line to eye level zt / zb scroll the current line to the top / bottom s toggle split / unified zw toggle line wrapping zh / zl scroll long lines left / right; hold z to repeat t cycle theme ⌘/Ctrl+b toggle the file tree (Shift: comments panel) o GitHub repository and pull request m, then 1–6 open the mode picker and choose an entry < / > older / newer commit or range-diff pair"
  - heading "Search" [level=4]
  - text: "/ search the current file, then n / N between matches g/ search changed files (toggle: diff + context / full file) ⌘/Ctrl+p or gf search files by name w / b focus the next / previous symbol on the line 0 / $ focus the first / last symbol on the line * / # next / previous occurrence of the focused word"
  - heading "Code intelligence (language server)" [level=4]
  - text: "hover a symbol or gh signature and docs tooltip (gh: focused word); Esc closes click a symbol definition / type definition / references popover gd or ⌘/Ctrl+click go to the definition, or its references from there gy go to the definition of the hovered symbol’s type gA list references; j / k, Enter to jump, n / N to step gs / gS symbols in the current file / across the repository"
  - heading "Change graph (language server)" [level=4]
  - text: "M graph of changed symbols and dependents; again: the diff right-click a folder Show in graph: only the changes under it h / j / k / l select the next symbol left / down / up / right Enter open the selected symbol in the diff zz double-click frame the selection and its links, or fit the graph / Ctrl+F find a box by name; Enter, then n / N between matches s / d / T toggle symbol nodes / dependents / tests 0 + / - fit the graph / zoom in / out scroll / pinch pan / zoom the graph"
  - heading "Iterations" [level=4]
  - text: "r reload once the compared refs moved ii latest iteration vs. the one before; again: the range ij / ik span’s lower end one iteration older / newer iJ / iK span’s higher end one iteration older / newer i, then 1–9 compare that iteration with the latest"
  - heading "General" [level=4]
  - text: "? toggle this help Esc close composer, search, or menu; clear selection"