schema_version: 1

context:
  version: "0.3.1"

package:
  name: diffle
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  script:
    interpreter: brush
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      # The Rust binary embeds the web client from dist/client
      - npm ci --ignore-scripts
      - npm run build
      # aws-lc-sys needs clang-cl to assemble its ARM64 sources; conda-forge sets CC to cl.exe
      - if: win and arm64
        then: export AWS_LC_SYS_CC=clang-cl
      - cargo install --locked --no-track --bins --root "${LIBRARY_PREFIX:-$PREFIX}" --path crates/diffle
      - mkdir -p "$PREFIX/etc/pixi/diffle"
      - touch "$PREFIX/etc/pixi/diffle/global-ignore-conda-prefix"
      - if: unix
        then:
          - mkdir -p "$PREFIX/share/zsh/site-functions" "$PREFIX/share/bash-completion/completions" "$PREFIX/share/fish/vendor_completions.d"
          - '"$PREFIX/bin/diffle" completion --shell zsh > "$PREFIX/share/zsh/site-functions/_diffle"'
          - '"$PREFIX/bin/diffle" completion --shell bash > "$PREFIX/share/bash-completion/completions/diffle"'
          - '"$PREFIX/bin/diffle" completion --shell fish > "$PREFIX/share/fish/vendor_completions.d/diffle.fish"'

requirements:
  build:
    - brush
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cmake
    - nodejs >=24.14
    # aws-lc-sys needs clang-cl to assemble its ARM64 sources
    - if: win and arm64
      then: clang
  extras:
    python:
      - pyrefly >=1.3.0
    rust:
      - rust-analyzer
    typescript:
      - typescript-language-server
    go:
      - gopls
    ruby:
      - ruby-lsp
    java:
      - jdtls
    lua:
      - lua-language-server
    terraform:
      - terraform-ls
    json:
      - vscode-langservers-extracted
    yaml:
      - yaml-language-server
    toml:
      - tombi

tests:
  - package_contents:
      bin:
        - diffle
      files:
        - etc/pixi/diffle/global-ignore-conda-prefix
        - if: unix
          then:
            - share/zsh/site-functions/_diffle
            - share/bash-completion/completions/diffle
            - share/fish/vendor_completions.d/diffle.fish
  - script:
      - diffle --help
      - diffle --version

about:
  homepage: https://diffle.app
  summary: Local git diff reviewer in the browser with line comments exported as agent prompts
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRD_PARTY_NOTICES.md
  repository: https://github.com/moritzwilksch/diffle
