[workspace]
name = "diffle"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64", "win-64", "win-arm64"]
preview = ["pixi-build"]
exclude-newer = "7d"

[package]
name = "diffle"

[package.build.backend]
name = "pixi-build-rattler-build"
version = "*"

[dependencies]
# The same release rust-toolchain.toml names; rustup is not involved under pixi.
rust = "1.99.*"
nodejs = "24.*"
git = ">=2.40"
gh = "*"
cmake = "*"
lefthook = "*"
zizmor = "*"
cargo-about = ">=0.9.2,<0.10"

[target.linux.dependencies]
c-compiler = "*"

# conda-forge builds no git-cliff for win-arm64; the release workflow runs on Linux.
[target.unix.dependencies]
git-cliff = ">=2,<3"

[target.win-64.dependencies]
git-cliff = ">=2,<3"

[tasks]
install-node = { cmd = "npm ci", inputs = ["package-lock.json"], outputs = ["node_modules/.package-lock.json"] }
# build
build-client = { cmd = "npm run build", depends-on = ["install-node"] }
build-release = { cmd = "cargo build --release --locked", depends-on = ["build-client"] }
build-debug = { cmd = "cargo build --locked", depends-on = ["build-client"] }
# test
test-node = { cmd = "npm test", depends-on = ["install-node"] }
test-rust = { cmd = "cargo test --locked --no-fail-fast", depends-on = ["build-client"] }
e2e = { cmd = "npm run test:e2e --", depends-on = ["build-release"] }
e2e-report = { cmd = "npm run test:e2e:report", depends-on = ["install-node"] }
# lefthook
lefthook-run = { cmd = "lefthook run pre-commit --all-files", depends-on = ["install-node"] }
lefthook-install = "lefthook install"
# useful stuff
fixture = { cmd = "npm run fixture --", depends-on = ["install-node"] }
diffle = { cmd = "cargo run --", depends-on = ["build-client"] }
# release
licenses = { cmd = "node scripts/licenses.ts", depends-on = ["build-client"] }
smoke = { cmd = "node scripts/smoke-binary.ts target/release/diffle", depends-on = ["build-release"] }
package = { cmd = "node scripts/package-binary.ts", depends-on = ["smoke"] }
npm-packages = "node scripts/npm-packages.ts archives npm-packages --smoke"
package-crate = { cmd = "node scripts/package-crate.ts", depends-on = ["build-client"] }

[feature.lsp-web.dependencies]
typescript-language-server = "*"
typescript = "*"
vue-language-server = "*"
tailwindcss-language-server = "*"
yaml-language-server = "*"

[feature.lsp-rust.dependencies]
rust-analyzer = "*"
# The standard library's source; without it rust-analyzer resolves no method that needs core.
rust-src = "1.99.*"

[feature.lsp-python.dependencies]
pyrefly = "*"
python = "3.15.*"

[feature.lsp-more.dependencies]
# gopls = "*"
go = "*"
clang-tools = "*"
# lua-language-server = "*"
# terraform-ls = "*"
tombi = "*"
bash-language-server = "*"

[environments]
default = ["lsp-web", "lsp-rust", "lsp-python", "lsp-more"]
