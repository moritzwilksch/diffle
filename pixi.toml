[workspace]
name = "diffle"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
# The same release rust-toolchain.toml names; rustup is not involved under pixi.
rust = "1.99.*"
nodejs = "24.*"
git = ">=2.40"
gh = "*"
cmake = "*"

[target.linux.dependencies]
c-compiler = "*"

[tasks]
install = { cmd = "npm ci", inputs = ["package-lock.json"], outputs = ["node_modules/.package-lock.json"] }
# npm builds the client alone; cargo builds the binary that embeds it, so the client comes first.
build = { cmd = "npm run build", depends-on = ["install"] }
# A local source run: a debug build reads dist/client from disk.
dev = { cmd = "cargo run -- working --no-open", depends-on = ["build"] }
release = { cmd = "cargo build --release --locked", depends-on = ["build"] }
# Everything a change must pass before it is finished.
test = { cmd = "npm test", depends-on = ["install"] }
test-rust = { cmd = "cargo test", depends-on = ["install"] }
typecheck = { cmd = "npm run typecheck", depends-on = ["install"] }
lint = { cmd = "npm run lint && cargo clippy --all-targets -- -D warnings", depends-on = ["install"] }
format = { cmd = "npm run format && cargo fmt --all", depends-on = ["install"] }
# The pre-commit hook over every file, as CI's lint job runs it.
check = { cmd = "npm run check", depends-on = ["install"] }
install-hooks = { cmd = "npm run install-hooks", depends-on = ["install"] }
# `pixi run fixture <dir>` builds the repository the tests review, for hands-on testing.
fixture = { cmd = "npm run fixture --", depends-on = ["install"] }
# `diffle lsp` lists which servers an environment resolves.
lsp = { cmd = "cargo run -- lsp", depends-on = ["install"] }

# Language servers on PATH, grouped as the Nix flake's packages are. `pixi run -e lsp dev` reviews
# with all of them; a narrower environment keeps the others out of the probe. The JSON, CSS and
# HTML servers (vscode-langservers-extracted) are absent: conda-forge's build pins Node 22.
[feature.lsp-web.dependencies]
typescript-language-server = "*"
typescript = "*"
vue-language-server = "*"
tailwindcss-language-server = "*"
yaml-language-server = "*"
tombi = "*"
bash-language-server = "*"

[feature.lsp-rust.dependencies]
rust-analyzer = "*"

[feature.lsp-python.dependencies]
pyrefly = "*"
python = "3.13.*"

# lua-language-server has no Windows build on conda-forge.
[feature.lsp-more]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]

[feature.lsp-more.dependencies]
gopls = "*"
go = "*"
clang-tools = "*"
lua-language-server = "*"
terraform-ls = "*"

[environments]
lsp = { features = ["lsp-web", "lsp-rust", "lsp-python", "lsp-more"], solve-group = "default" }
lsp-web = { features = ["lsp-web"], solve-group = "default" }
lsp-rust = { features = ["lsp-rust"], solve-group = "default" }
lsp-python = { features = ["lsp-python"], solve-group = "default" }
