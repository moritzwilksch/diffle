schema_version: 1

context:
  version: "0.1.1"

package:
  name: diffle
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/@moritzwilksch/diffle/-/diffle-${{ version }}.tgz
  sha256: 55b86e872e1220ee329253e6abdcd0f702bb1a523a180fd36582b2cfc22ecb24

build:
  number: 0
requirements:
  build:
    - nodejs
    - pnpm
    - pnpm-licenses
  host:
    - nodejs
  run:
    - nodejs
  extras:
    python:
      - pyrefly >=1.3.0
    rust:
      - rust-analyzer
    typescript:
      - typescript-language-server
    go:
      - gopls
    ruby:
      - ruby-lsp
    java:
      - jdtls
    lua:
      - lua-language-server
    terraform:
      - terraform-ls
tests:
  - package_contents:
      bin:
        - diffle
      files:
        - etc/pixi/diffle/global-ignore-conda-prefix
        - if: unix
          then:
            - share/zsh/site-functions/_diffle
            - share/bash-completion/completions/diffle
            - share/fish/vendor_completions.d/diffle.fish
  - script:
      - diffle --help
      - diffle --version
about:
  homepage: https://github.com/moritzwilksch/diffle
  summary: Local git diff reviewer in the browser with line comments exported as agent prompts
  license: Apache-2.0
  license_file:
    - LICENSE
    - third-party-licenses.txt
  repository: https://github.com/moritzwilksch/diffle

extra:
  recipe-maintainers:
    - moritzwilksch
    - pavelzw
