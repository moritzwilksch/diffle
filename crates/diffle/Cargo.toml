[package]
name = "diffle"
# The release reads package.json; build.rs passes its version on as DIFFLE_VERSION.
version = "0.0.0"
description = "Local git diff reviewer in the browser with line comments exported as agent prompts"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regress = "0.10"

[build-dependencies]
prettyplease = "0.2"
schemars = "0.8"
serde_json = "1"
regress = "0.10"
syn = "2"
typify = "0.8"
