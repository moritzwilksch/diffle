[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# cargo-mutants builds every mutant; debug info would only slow the rebuilds.
[profile.mutants]
inherits = "test"
debug = "none"
