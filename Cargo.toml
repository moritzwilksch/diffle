[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Optimised like release but without its slow link: the e2e suite needs a fast binary, not a small one.
[profile.e2e]
inherits = "release"
lto = false
codegen-units = 16
strip = false

# gix hashes worktree files in-process; unoptimised SHA-1 makes debug builds crawl over a large file.
[profile.dev.package.sha1dc]
opt-level = 3

# In-process search runs the regex engine over whole repositories; tests run it unoptimised otherwise.
[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3
