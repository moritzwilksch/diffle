name: Update snapshots
# Regenerate the e2e screenshots in the same container CI compares them in, and push the result
# to the branch. Run it from the Actions tab on your branch after an intended UI change; the
# snapshot report on the pull request then shows what changed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Regenerate and commit
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Regenerate snapshots
        run: |
          npm ci
          npm run test:e2e:update
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '**/__snapshots__/**'
          if git diff --cached --quiet; then
            echo "Snapshots are already up to date."
            exit 0
          fi
          git commit -m "test(e2e): update snapshots"
          git push origin "HEAD:${{ github.ref_name }}"
