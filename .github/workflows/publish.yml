name: Publish
on:
  push:
    tags:
      - v*

jobs:
  # npm publishing is paused until the binaries ship as per-platform npm packages; releases
  # carry the binaries and the installers alone.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release tag matches package version
        run: |
          expected="v$(jq -r '.version' package.json)"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $expected"
            exit 1
          fi

  binaries:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/binaries.yml

  # Attaches the binaries, their checksums, and the installers to the tag's release.
  release:
    needs: [binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag's CHANGELOG.md section, which the release pull request generated.
      - name: Write release notes
        run: awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/ { p = index($0, "## [" v "]") == 1; next } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: diffle-*
          path: out
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install.sh scripts/install.ps1 out/
          (cd out && sha256sum diffle-* > SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* --verify-tag --notes-file "$RUNNER_TEMP/notes.md"
          fi
