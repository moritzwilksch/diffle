name: Publish
on:
  push:
    tags:
      - v*

env:
  CARGO_TERM_COLOR: always
  CLICOLOR_FORCE: 1
  FORCE_COLOR: 1

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release tag matches package version
        run: |
          expected="v$(jq -r '.version' package.json)"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $expected"
            exit 1
          fi

  build:
    needs: verify
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
          - windows-11-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      # No build cache: a release compiles from scratch rather than from artifacts a pull
      # request's run may have written.
      - run: pixi run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: out/*
          archive: false

  npm-packages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: diffle-*
          path: archives
          merge-multiple: true
          # Without it a .zip archive (`archive: false`) arrives unpacked, and the Windows
          # archives are lost.
          skip-decompress: true
      - run: pixi run npm-packages
      # The tarballs alone: an artifact drops file modes, which only a tarball keeps.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: npm-packages/*.tgz

  # Publishes the platform packages, then the launcher that depends on them, through trusted
  # publishing (OIDC). A package already at this version is skipped, so a rerun finishes what an
  # earlier one left.
  npm:
    needs: npm-packages
    runs-on: ubuntu-latest
    environment: npmjs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # The job installs nothing, so there is nothing to cache, and nothing a cache could poison.
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: npm-packages
      - name: Publish packages
        run: |
          for tarball in npm-packages/diffle-*.tgz npm-packages/diffle.tgz; do
            manifest=$(tar -xOzf "$tarball" package/package.json)
            name=$(jq -r .name <<< "$manifest")
            version=$(jq -r .version <<< "$manifest")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published."
              continue
            fi
            npm publish "./$tarball" --access public --provenance
          done

  # Publishes the crate, its client build included, through trusted publishing (OIDC). A version
  # already on crates.io is skipped, so a rerun finishes what an earlier one left.
  crates-io:
    needs: build
    runs-on: ubuntu-latest
    environment: cratesio
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          activate-environment: true
      - name: Check whether this version is published
        id: published
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -A 'diffle-release (github.com/moritzwilksch/diffle)' \
            "https://crates.io/api/v1/crates/diffle/${GITHUB_REF_NAME#v}")
          if [ "$status" = 200 ]; then
            echo "diffle ${GITHUB_REF_NAME#v} is already published."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: pixi run package-crate
      - if: steps.published.outputs.skip != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # package-crate already compiled the package on its own.
      - if: steps.published.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --allow-dirty --no-verify -p diffle

  # Attaches the binaries, their checksums, and the installers to the tag's release.
  release:
    needs: [build, npm, crates-io]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag's CHANGELOG.md section, which the release pull request generated.
      - name: Write release notes
        run: awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/ { p = index($0, "## [" v "]") == 1; next } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: diffle-*
          path: out
          merge-multiple: true
          # Without it a .zip archive (`archive: false`) arrives unpacked, and the Windows
          # archives are lost.
          skip-decompress: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install.sh scripts/install.ps1 out/
          (cd out && sha256sum diffle-* > SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* --verify-tag --notes-file "$RUNNER_TEMP/notes.md"
          fi
