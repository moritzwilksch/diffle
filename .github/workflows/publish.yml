name: Publish
on:
  push:
    tags:
      - v*

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npmjs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify release tag matches package version
        run: |
          expected="v$(jq -r '.version' package.json)"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $expected"
            exit 1
          fi
      - name: Publish package
        run: |
          npm ci
          npm publish

  sea:
    permissions:
      contents: read
    uses: ./.github/workflows/sea.yml

  # Attaches the binaries, their checksums, and the installers to the tag's release.
  release:
    needs: [publish, sea]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: diffle-*
          path: out
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install.sh scripts/install.ps1 out/
          (cd out && sha256sum diffle-* > SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* --verify-tag --generate-notes
          fi
