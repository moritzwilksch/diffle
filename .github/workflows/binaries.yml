name: Binaries
on:
  workflow_call:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: windows-latest, target: windows-x64 }
          - { os: windows-11-arm, target: windows-arm64 }
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # rustup reads rust-toolchain.toml on the first cargo call.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The release binary embeds dist/client, so the client is built first.
      - name: Build binary
        shell: bash
        run: |
          npm ci
          npm run build
          cargo build --release --locked
      - name: Smoke test
        shell: bash
        run: node scripts/smoke-binary.mjs target/release/diffle${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Archive
        shell: bash
        run: |
          mkdir out
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a -tzip "out/diffle-${{ matrix.target }}.zip" ./target/release/diffle.exe ./LICENSE ./THIRD_PARTY_NOTICES.md
          else
            tar -czf "out/diffle-${{ matrix.target }}.tar.gz" -C target/release diffle -C ../.. LICENSE THIRD_PARTY_NOTICES.md
          fi
      # Serves this job's archive as a one-asset release and installs from it.
      - name: Test installer
        shell: bash
        run: |
          mkdir release
          cp out/* release/
          (cd release && sha256sum diffle-* > SHA256SUMS)
          "$(command -v python3 || command -v python)" -m http.server 8765 --bind 127.0.0.1 --directory release > /dev/null 2>&1 &
          trap 'kill $!' EXIT
          # Python can take several seconds to start on windows-11-arm; wait until it answers.
          curl -sSf --retry 30 --retry-delay 1 --retry-connrefused -o /dev/null http://127.0.0.1:8765/SHA256SUMS
          # Each installer runs the installed binary's --version before it reports success.
          export DIFFLE_DOWNLOAD_URL=http://127.0.0.1:8765 DIFFLE_INSTALL_DIR="$RUNNER_TEMP/diffle-bin"
          if [[ "$RUNNER_OS" == Windows ]]; then
            pwsh -NoProfile -File scripts/install.ps1
            # Again under Windows PowerShell 5.1, over the existing install.
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1
          else
            sh scripts/install.sh
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: out/*
          archive: false
