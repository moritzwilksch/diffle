name: npm packages
# Assembles the npm packages from the Binaries workflow's archives and runs the launcher over
# this runner's package; Publish uploads what this produces.
on:
  workflow_call:

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: diffle-*
          path: archives
          merge-multiple: true
      - name: Assemble and smoke test
        run: node scripts/npm-packages.mjs archives npm-packages --smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: npm-packages
