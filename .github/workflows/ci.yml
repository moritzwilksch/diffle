name: CI
on:
  push:
    branches:
      - main
  pull_request:

# The log is not a terminal, so cargo, clippy, vitest, oxlint and diffle itself would print plain
# text; these tell each to colour anyway.
env:
  CARGO_TERM_COLOR: always
  CLICOLOR_FORCE: 1
  FORCE_COLOR: 1

jobs:
  nix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Build Nix package
        run: nix build
      - name: Smoke test Nix package
        run: nix run . -- --help

  pixi-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          run-install: false
      - run: pixi publish --target-dir output
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pixi-build-package
          path: output/**/*.conda
          if-no-files-found: error

  test:
    runs-on: ${{ matrix.os }}
    # A hung test fails here instead of at GitHub's six-hour limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
          - windows-11-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      # The runner's system config converts line endings in every repository the tests create and commit to.
      - name: Disable autocrlf
        if: runner.os == 'Windows'
        run: git config --system core.autocrlf false
      - run: pixi run test-node

  rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
          - windows-11-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The runner's system config converts line endings in every repository the tests create and commit to.
      - name: Disable autocrlf
        if: runner.os == 'Windows'
        run: git config --system core.autocrlf false
      - run: pixi run test-rust

  # The runner and diffle run on the host, the browser in Playwright's container (compose.yml),
  # here as on every developer machine: the screenshots are the container's.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pixi run e2e
      # Expected, actual and diff images plus traces for every failed scenario, and the HTML report.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
      # Rewrites the snapshots of the failed scenarios; the Update snapshots workflow commits them.
      - name: Regenerate failed snapshots
        if: failure()
        run: pixi run e2e --last-failed --update-snapshots
      - name: Collect changed snapshots
        if: failure()
        run: |
          mkdir snapshot-updates
          git ls-files -z --modified --others --exclude-standard -- test/e2e/__snapshots__ \
            | xargs -0 --no-run-if-empty cp --parents -t snapshot-updates
      - name: Upload changed snapshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-snapshots
          path: snapshot-updates
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pixi run lefthook-run

  # Builds and smoke-tests the release binaries so a packaging break shows up before a tag.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
          - windows-11-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pixi run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: out/*
          archive: false

  npm-packages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: diffle-*
          path: archives
          merge-multiple: true
          # Without it a .zip archive (`archive: false`) arrives unpacked, and the Windows
          # archives are lost.
          skip-decompress: true
      - run: pixi run npm-packages
      # The tarballs alone: an artifact drops file modes, which only a tarball keeps.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: npm-packages/*.tgz

  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          locked: true
      # The `npm ci` in the other jobs only checks the dependency tree, so drift in
      # the lockfile's own metadata (name, version, bin, engines) passes it silently.
      # `--package-lock-only` needs no install, so this job does not run `npm ci`.
      - name: Check package-lock.json is up to date
        run: |
          pixi run -- npm install --package-lock-only --no-audit --no-fund
          git diff --exit-code -- package-lock.json || {
            echo "::error file=package-lock.json::package-lock.json is out of date; run \`npm install\` and commit the result. Use Node 24 as \`engines\` requires: older npm keeps optional peer entries this npm drops, so the lockfile it writes fails here."
            exit 1
          }
      # The notices file is generated from Cargo.lock; the pre-commit hook regenerates it, and this
      # catches a commit that skipped the hook or a crate whose licence about.toml does not accept.
      - name: Check THIRD_PARTY_NOTICES.md is up to date
        run: |
          pixi run licenses
          git diff --exit-code -- THIRD_PARTY_NOTICES.md || {
            echo "::error file=THIRD_PARTY_NOTICES.md::THIRD_PARTY_NOTICES.md is out of date; run \`pixi run licenses\` and commit the result."
            exit 1
          }
