name: npm packages
description: Assembles the npm packages from the build jobs' archives and runs the launcher over this runner's package.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: diffle-*
        path: archives
        merge-multiple: true
    - name: Assemble and smoke test
      shell: bash
      run: node scripts/npm-packages.ts archives npm-packages --smoke
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: npm-packages
        path: npm-packages
