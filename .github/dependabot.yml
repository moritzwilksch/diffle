version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      gh-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # build.rs hands typify a schemars 0.8 RootSchema, and typify does not re-export it;
      # move with typify: https://github.com/oxidecomputer/typify/issues/886
      - dependency-name: schemars
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
